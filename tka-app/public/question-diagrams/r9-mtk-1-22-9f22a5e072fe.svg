<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Dua persegi panjang sebangun. Sisi bawah bangun kecil 4 cm. Faktor skala ke bangun besar 3. Sisi bawah bangun besar ditanyakan.</title><rect width="400" height="250" fill="white"/><g fill="#edf1ff" stroke="#334eb5" stroke-width="2.5" stroke-linejoin="round"><rect x="30" y="125" width="95" height="60"/><rect x="185" y="75" width="190" height="120"/></g><g fill="#172746" font-family="Arial,sans-serif" font-size="18" font-weight="600"><text x="78" y="220" text-anchor="middle">4 cm</text><text x="280" y="225" text-anchor="middle">?</text><text x="200" y="34" text-anchor="middle">Faktor skala = 3</text></g></svg>